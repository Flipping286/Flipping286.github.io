<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads Dashboard</title>
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 40px 20px;
    }
    
    /* Big Title */
    h1 {
      font-size: 3.5em;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.2);
    }

    /* Search Bar */
    .search-container {
      text-align: center;
      margin-bottom: 40px;
    }
    
    #download-search {
      padding: 12px;
      width: 80%;
      max-width: 500px;
      border-radius: 8px;
      border: none;
      font-size: 1.1em;
      background-color: #222;
      color: white;
      outline: none;
      box-shadow: inset 0px 0px 5px rgba(0,0,0,0.5);
    }
    
    #download-search::placeholder {
      color: #888;
    }

    /* Download Items Layout */
    .download-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1a1a1a;
      padding: 15px 25px;
      border-radius: 10px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
      border: 1px solid #333;
    }
    
    .emoji {
      font-size: 1.8em;
    }
    
    .slot {
      font-weight: bold;
      color: #666;
      width: 70px;
      text-align: center;
    }
    
    .name {
      flex-grow: 1;
      margin-left: 20px;
      font-size: 1.2em;
      font-family: monospace;
      color: #ddd;
    }
    
    .download-btn {
      background-color: #007bff;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }
    
    .download-btn:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<div class="side-decor left-decor">
    <p>0</p><p>1</p><p>☺</p><p>1</p><p>0</p><p>🐧</p><p>1</p><p>👾</p><p>0</p>
  </div>
  <div class="side-decor right-decor">
    <p>1</p><p>0</p><p>👾</p><p>0</p><p>1</p><p>🐧</p><p>1</p><p>0</p><p>☺</p>
  </div>
  
  <!-- Big Title -->
  <h1>📥 Downloads 💾</h1>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" id="download-search" placeholder="Search downloads...">
  </div>

  <!-- Download Items Layout -->
  <div class="download-list">
    
    <!-- Slot 1: Your custom exe file -->
    <div class="item-row">
      <span class="emoji">👾</span>
      <span class="slot">Slot 1</span>
      <span class="name">you.are.an.idiot.text.messages.exe</span>
      <a href="https://github.com/Flipping286/Flipping286.github.io/releases/latest/download/you.are.an.idiot.text.messages.exe" class="download-btn" download>Download</a>
    </div>

    <!-- Slot 2: Placeholder for your next file -->
    <div class="item-row">
      <span class="emoji">🏴‍☠️</span>
      <span class="slot">Slot 2</span>
      <span class="name">Empty Slot</span>
      <a href="#" class="download-btn" style="background-color: #444; cursor: not-allowed;">Pending</a>
    </div>

  </div>

  <!-- Search Bar Logic -->
  <script>
    document.getElementById('download-search').addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      const rows = document.querySelectorAll('.item-row');
      
      rows.forEach(row => {
        const fileName = row.querySelector('.name').textContent.toLowerCase();
        if (fileName.includes(searchTerm)) {
          row.style.display = 'flex';
        } else {
          row.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
