<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y*utube</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- THE GOOGLE CLASSROOM PANIC SCREEN UI -->
<div id="panicUI" style="display: none; background: #ffffff; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 999999; overflow-y: auto; font-family: 'Google Sans', Roboto, Arial, sans-serif; color: #3c4043;">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-bottom: 1px solid #e0e0e0; background: #fff;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="font-size: 24px; cursor: pointer; padding: 12px; color: #5f6368;">☰</span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <img src="https://ssl.gstatic.com/classroom/favicon.png" alt="Classroom Logo" style="width: 24px; height: 24px;">
        <span style="font-size: 22px; color: #5f6368;">Classroom</span>
      </div>
    </div>
  </div>
  <div style="padding: 40px; font-size: 20px;">Redirecting to Classroom...</div>
</div>
  
  <!-- Ambient Hacker Decor -->
  <div class="side-decor left-decor">
    <p>0</p><p>1</p><p>☺</p><p>1</p><p>0</p><p>🐧</p><p>1</p><p>👾</p><p>0</p>
  </div>
  <div class="side-decor right-decor">
    <p>1</p><p>0</p><p>👾</p><p>0</p><p>1</p><p>🐧</p><p>1</p><p>0</p><p>☺</p>
  </div>

  <main class="container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>Y*utube Dashboard</h1>
      <a href="index.html" class="info-btn">Back</a>
    </div>

    <p style="margin-top:12px; color:var(--text-muted);">Paste a Y*utube link or ID below and click <strong>Load</strong>. The player uses the no-cookie embed.</p>

    <div class="search-bar" style="margin-top:12px;">
      <input type="text" id="videoUrl" placeholder="Enter Y*utube link or ID" aria-label="Video URL or ID">
      <button id="loadBtn" type="button">Load</button>
    </div>

    <iframe id="player" class="player-frame" src="" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="Resource player" style="margin-top:18px;"></iframe>
  </main>

  <script src="youtube.js"></script>
</body>
</html>
