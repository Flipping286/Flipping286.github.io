<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Games</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="games.css">
</head>
<body>
  <!-- Ambient side emojis -->
  <div class="side-decor left-decor">
    <p>0</p><p>1</p><p>☺</p><p>1</p><p>0</p><p>🐧</p><p>1</p><p>👾</p><p>0</p>
  </div>
  <div class="side-decor right-decor">
    <p>1</p><p>0</p><p>👾</p><p>0</p><p>1</p><p>🐧</p><p>1</p><p>0</p><p>☺</p>
  </div>

  <main class="container">
    <h1 style="margin-bottom:6px;">Games</h1>
    <p class="welcome-text">Welcome to Games!</p>

    <!-- Simple thumbnail grid: no boxes, just thumbnails below the heading -->
    <div id="gamesGrid" class="games-grid" aria-live="polite">
      <!-- Example placeholders: replace src/thumb with real assets when available -->
      <button class="game-thumb" data-src="assets/games/demo1/index.html" aria-label="Play Demo 1">
        <span class="thumb-icon">🎮</span>
        <span class="thumb-title">Demo 1</span>
      </button>

      <button class="game-thumb" data-src="assets/games/demo2/index.html" aria-label="Play Demo 2">
        <span class="thumb-icon">🕹️</span>
        <span class="thumb-title">Demo 2</span>
      </button>

      <button class="game-thumb" data-src="assets/games/demo3/index.html" aria-label="Play Demo 3">
        <span class="thumb-icon">🚗</span>
        <span class="thumb-title">Demo 3</span>
      </button>

      <button class="game-thumb" data-src="assets/games/demo4/index.html" aria-label="Play Demo 4">
        <span class="thumb-icon">🍪</span>
        <span class="thumb-title">Demo 4</span>
      </button>

      <!-- more thumbnails can be added later -->
    </div>

    <div style="margin-top:28px; text-align:left;">
      <a href="index.html" class="info-btn">Back</a>
    </div>
  </main>

  <footer class="footer">Made by Flipping286, Optimized for students.</footer>

  <script src="games.js"></script>
</body>
</html>
