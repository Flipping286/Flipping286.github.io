<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Games - Flipping286's Things!</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Slowed down the emoji flash to 4 seconds */
    @keyframes pulse-glow {
      0% { text-shadow: 0 0 5px rgba(255,255,255,0.2); transform: scale(1); }
      50% { text-shadow: 0 0 20px rgba(255,255,255,0.8); transform: scale(1.1); }
      100% { text-shadow: 0 0 5px rgba(255,255,255,0.2); transform: scale(1); }
    }
    .game-icon {
      font-size: 3rem;
      margin-bottom: 10px;
      animation: pulse-glow 4s infinite ease-in-out; 
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 style="text-align: center; margin-bottom: 20px;">🎮 Games</h1>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="index.html" class="info-btn" style="display: inline-block;">← Back Home</a>
    </div>

    <!-- NEW WORKING SEARCH BAR WITH MAGNIFYING GLASS -->
    <div class="search-container" style="margin-bottom: 25px;">
        <div style="display: flex; gap: 10px;">
            <input type="text" id="gameSearch" placeholder="Search 150+ games..." onkeyup="filterGames()" style="flex: 1; padding: 12px 16px; background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box;">
            <button onclick="filterGames()" style="padding: 0 16px; background-color: #00ff88; color: #0b0f19; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px;">🔍</button>
        </div>
        <div id="no-results" style="display: none; color: #8b949e; text-align: center; margin-top: 15px; font-size: 14px;">
            Sorry, either we don’t have that game or you spelled it wrong.
        </div>
    </div>

    <!-- GAME GRID -->
    <div class="game-grid" id="gameGrid">

      <!-- ======================================================= -->
      <!-- ⚠️ PASTE ALL 150+ OF YOUR GAME CARDS RIGHT HERE!!! ⚠️ -->
      <!-- ======================================================= -->
      
      <div class="game-card">
          <div class="game-icon">🍉</div>
          <div class="game-title">Suika Game</div>
          <button onclick="playGame('https://suika-game.app/en/')">Launch</button>
      </div>
      <div class="game-card">
          <div class="game-icon">🍪</div>
          <div class="game-title">Cookie Clicker</div>
          <button onclick="playGame('https://orteil.dashnet.org/cookieclicker/')">Launch</button>
      </div>

      <!-- ======================================================= -->
      <!-- ======================================================= -->

    </div>
  </main>

  <script src="script.js"></script>
  
  <!-- THIS SCRIPT MAKES THE SEARCH BAR WORK -->
  <script>
    function filterGames() {
        let input = document.getElementById('gameSearch').value.toLowerCase();
        let cards = document.getElementsByClassName('game-card');
        let hasResults = false;

        for (let i = 0; i < cards.length; i++) {
            let titleElement = cards[i].querySelector('.game-title');
            if (titleElement) {
                let title = titleElement.innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                    hasResults = true;
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
        document.getElementById('no-results').style.display = hasResults ? "none" : "block";
    }

    // Stealth Tab Disguise for the games page
    let originalTitleGames = document.title;
    window.addEventListener("blur", () => { document.title = "Google Classroom"; });
    window.addEventListener("focus", () => { document.title = originalTitleGames; });
  </script>
</body>
</html>
