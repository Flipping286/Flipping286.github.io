        /* Restored Original Layout Styling */
        body {
            background-color: #111418;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
            margin: 0;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .game-list {
            display: inline-block;
            text-align: left;
            list-style-type: disc;
            padding-left: 20px;
        }

        .game-list li {
            margin-bottom: 8px;
        }

        .game-list button {
            background-color: #00ff88;
            color: #000000;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .game-list button:hover {
            background-color: #00cc6a;
        }

        /* Fullscreen Game Player Overlay 📟 */
        #game-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 99999;
        }
        #game-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #close-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            z-index: 100000;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        #close-btn:hover { opacity: 1; }
    </style>

        function playGame(url) {
            document.getElementById('game-frame').src = url;
            document.getElementById('game-overlay').style.display = 'block';

            document.getElementById('game-overlay').style.display = 'none';
            document.getElementById('game-frame').src = '';
