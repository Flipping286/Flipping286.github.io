    <style>
        body { font-family: monospace; background-color: #111; color: #0f0; text-align: center; padding: 20px; }
        .game-list { list-style: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; max-height: 85vh; overflow-y: auto; }
        .game-list li { width: 450px; }
        .game-list button { display: block; width: 100%; padding: 10px; background-color: #222; color: #0ff; text-decoration: none; border: 2px solid #0ff; border-radius: 6px; font-family: inherit; font-size: 1rem; cursor: pointer; }
        .game-list button:hover { background-color: #0ff; color: #111; }
        
        /* Fullscreen Game Player Overlay */
        #game-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 99999;
        }
        #game-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #close-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: #ff0055;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            z-index: 100000;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        #close-btn:hover { opacity: 1; }
    </style>
</head>

        function playGame(url) {
